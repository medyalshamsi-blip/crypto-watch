name: backtest
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Walk-forward backtest of the breakout strategy
        run: node engine/backtest.js
      - name: Save the results
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/backtest)" ]; then
            git config user.name "crypto-watch backtest"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/backtest
            git commit -q -m "backtest $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase
            git push -q
          fi
