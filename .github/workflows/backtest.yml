name: backtest
on:
  workflow_dispatch:
    inputs:
      set:
        description: "pre (first four variants), book (book variants), scanner (daily playbook scanner, live vs book rules) or spikeradar (spike radar prompt replay)"
        required: false
        default: pre
        type: choice
        options: [pre, book, scanner, spikeradar]
permissions:
  contents: write
concurrency:
  group: backtest-${{ inputs.set }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Walk-forward backtest of the breakout strategy
        env:
          BT_SET: ${{ inputs.set }}
        run: if [ "$BT_SET" = scanner ]; then node engine/scanner-retest.js; elif [ "$BT_SET" = spikeradar ]; then node engine/spike-radar-test.js; else node engine/backtest.js; fi
      - name: Save the results
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/backtest)" ]; then
            git config user.name "crypto-watch backtest"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/backtest
            git commit -q -m "backtest ${{ inputs.set }} $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
          fi
